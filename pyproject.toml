[project]
name = "pengupool"
version = "0.5.0"
description = "Manage collaborating Claude Code and pi sessions: a terminal UI, a shared backend, and a VS Code/Cursor extension"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "textual-fspicker>=1.0.1",
]

[project.scripts]
pengupool = "pengupool.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pengupool"]
