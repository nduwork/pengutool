[project]
name = "pengupool"
version = "0.2.0"
description = "Backend for the PenguPool editor extension: manage collaborating Claude Code and pi sessions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pengupool = "pengupool.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pengupool"]
