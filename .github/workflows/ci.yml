name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv build --out-dir "$RUNNER_TEMP/pengupool-dist"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run compile
        working-directory: extension
      - run: npm run package -- --out "$RUNNER_TEMP/pengupool-ci.vsix"
        working-directory: extension
      - uses: actions/upload-artifact@v7
        with:
          name: pengupool-build
          path: |
            ${{ runner.temp }}/pengupool-dist/*
            ${{ runner.temp }}/pengupool-ci.vsix
          if-no-files-found: error
