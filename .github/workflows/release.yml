name: release
# A release IS a tag. `scripts/release.sh` bumps the version, updates CHANGELOG.md, tags vX.Y.Z and
# pushes; this job then tests, builds the wheel + pengupool.vsix (install.sh downloads it) and publishes
# the GitHub Release with the changelog section as notes. Nothing is tagged from CI.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - name: Never publish a red tag
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm test
        working-directory: extension
      - name: Version must match the tag
        run: |
          set -euo pipefail
          v=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "pyproject version $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - run: uv build --out-dir "$RUNNER_TEMP/pengupool-dist"
      - run: npm run package -- --out "$RUNNER_TEMP/pengupool.vsix"
        working-directory: extension
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="$v" '/^## \[/{p = index($0, "## [" v "]") == 1} p' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || echo "Release ${GITHUB_REF_NAME}" > "$notes"
          { echo; echo "Install everything (CLI, harness wiring, tracker, and the extension in every VS Code/Cursor found):"; echo; echo "\`curl -fsSL https://pengupool.nduwork.com/install.sh | PENGUPOOL_REF=${GITHUB_REF_NAME} bash\`"; } >> "$notes"
      - name: Publish
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        # Re-runnable: a release left half-published by a failed run gets its assets replaced. GitHub picks
        # "latest" by semver, so a backport tag never becomes what install.sh installs by default.
        run: |
          set -euo pipefail
          # SHA256SUMS lets install.sh check the VSIX before installing it into every editor
          (cd "$RUNNER_TEMP" && sha256sum pengupool.vsix pengupool-dist/* | sed 's# pengupool-dist/# #' > SHA256SUMS)
          assets=("$RUNNER_TEMP/pengupool-dist/"* "$RUNNER_TEMP/pengupool.vsix" "$RUNNER_TEMP/SHA256SUMS")
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --title "${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
